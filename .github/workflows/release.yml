name: Release

# Tags are vMAJOR.MINOR.PATCH, optionally with a PEP 440 pre-release suffix written the way
# uv normalizes it: v1.2.0a1, v1.2.0b1, v1.2.0rc1 (not v1.2.0-rc.1). The tag must equal
# "v" + the version in pyproject.toml. Pre-releases become GitHub pre-releases.
# This is the only workflow that publishes (GitHub Release and, opt-in, PyPI).
#
# Job graph (each step must pass before the next starts):
#   verify    tag is semver, matches the version, and its commit is on main      (contents: read)
#   ci        ci.yml on that exact commit: lint, format, types, 3-OS tests, polars floor,
#             wheel contents, installed-wheel smoke test; uploads the "dist" artifact (contents: read)
#   release   downloads that artifact and creates the GitHub Release  (the only contents: write)
#   publish-pypi  opt-in; needs reviewer approval on the "pypi" environment
# Nothing is rebuilt after CI: the files released and published are the files CI smoke-tested.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned so the toolchain cannot change underneath uv.lock; Renovate bumps it.
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.5"

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # The ancestry check needs origin/main. The token is not kept after checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check tag is semver and matches project version
        id: version
        run: |
          version=$(uv version --short)
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH[aN|bN|rcN]"
            exit 1
          fi
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the tagged commit is on main
        run: |
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Tag $TAG ($sha) is not on main. Merge it to main first, then tag."
            exit 1
          fi

  ci:
    name: CI on the tagged commit
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  release:
    name: Create GitHub Release
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets; this job runs no project code
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE

  # Opt-in. One-time setup is in docs/RELEASING.md. Publishes the exact files CI built.
  publish-pypi:
    name: Publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/child-mortality/
    permissions:
      id-token: write # OIDC token for trusted publishing; no API token is stored
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # skip-existing makes a re-run after a partial upload succeed.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
